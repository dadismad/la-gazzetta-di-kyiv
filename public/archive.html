<script>
(async function() {
  const resp = await fetch('./data/stories.json?t=' + Date.now(), {cache:'no-store'});
  const data = await resp.json();
  const allStories = data.all_stories || [];
  let filter = 'all';
  let search = '';

  // Read container from URL query param (e.g., ?container=monetary_order)
  const urlParams = new URLSearchParams(window.location.search);
  const containerParam = urlParams.get('container');
  if (containerParam) {
    filter = containerParam;
    // Activate the matching pill button
    const btn = document.querySelector('#archive-controls .container-pill[data-filter="' + containerParam + '"]');
    if (btn) btn.classList.add('active');
  }

  function render() {
    const results = document.getElementById('archiveResults');
    let stories = allStories;

    if (filter !== 'all') {
      stories = stories.filter(s => s.container === filter);
    }
    if (search) {
      const q = search.toLowerCase();
      stories = stories.filter(s => (s.headline||'').toLowerCase().includes(q));
    }

    if (stories.length === 0) {
      results.innerHTML = '<div class="container-empty"><p>No stories match.</p></div>';
      return;
    }

    results.innerHTML = '<div style="padding:12px 0;font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em;">' +
      stories.length + ' stories</div>' +
      stories.map(s => {
        const date = s.generated_at ? new Date(s.generated_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase() : '';
        const source = s.source_name || '';
        const container = s.container ? s.container.replace(/_/g,' ') : '';
        return '<article class="story-card">' +
          '<div class="story-card-header">' +
            '<span class="story-meta">' + date + ' · ' + source + ' · ' + container + '</span>' +
          '</div>' +
          '<h3 class="story-headline">' + (s.headline||'Untitled') + '</h3>' +
          (s.thesis ? '<p class="story-thesis">' + s.thesis + '</p>' : '') +
          '</article>';
      }).join('');
  }

  document.getElementById('archiveSearch').addEventListener('input', function(e) {
    search = e.target.value;
    render();
  });

  document.querySelectorAll('#archive-controls .container-pill').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#archive-controls .container-pill').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      filter = this.getAttribute('data-filter');
      render();
    });
  });

  render();
})();
</script>
