<!-- v23.5: Flow Node interlinking — links story to relevant flow nodes -->
<div id="flowNodeInterlink" style="margin:16px 0;padding:12px 16px;border:1px solid #E5E7EB;border-left:3px solid var(--gold);background:#FFFDF5;display:none;">
  <span style="font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-muted);">Linked Flow Nodes</span>
  <div id="flowNodeLinks" style="margin-top:6px;"></div>
  <a href="./flow-nodes.html" id="flowNodeViewAll" style="display:none;font-family:var(--sans);font-size:10px;font-weight:600;color:var(--gold);text-decoration:none;">View all in Flow Nodes →</a>
</div>
<script>
(function(){
  var sid = new URLSearchParams(location.search).get('id');
  if (!sid) return;
  fetch('./data/stories.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var story = (d.stories||[]).find(function(s){return s.story_id===sid;});
    if (!story || !story.impacted_flows || !story.impacted_flows.length) return;
    var interlink = document.getElementById('flowNodeInterlink');
    var linksEl = document.getElementById('flowNodeLinks');
    if (!interlink || !linksEl) return;
    interlink.style.display = 'block';
    story.impacted_flows.slice(0,3).forEach(function(fid){
      var a = document.createElement('a');
      a.href = './flow-nodes.html?flow=' + encodeURIComponent(fid);
      a.style.cssText = 'display:block;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink);text-decoration:none;padding:4px 0;border-bottom:1px solid #F3F4F6;';
      a.textContent = '→ Flow: ' + fid.slice(0,40);
      linksEl.appendChild(a);
    });
    document.getElementById('flowNodeViewAll').style.display = 'block';
  }).catch(function(){});
})();
</script>
