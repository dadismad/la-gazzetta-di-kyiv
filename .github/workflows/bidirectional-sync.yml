name: Bidirectional repo sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bidirectional-sync-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip bot-triggered push runs (loop guard)
        if: ${{ github.event_name == 'push' && github.actor == 'github-actions[bot]' }}
        run: |
          echo "Bot-originated push run skipped to avoid ping-pong loops."
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge peer updates into this repo
        env:
          PEER_URL: https://github.com/pureciclismo/gazzetta-di-kyiv.git
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PEER_BRANCH=$(git ls-remote --symref "$PEER_URL" HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
          [ -n "$PEER_BRANCH" ]

          git remote remove peer 2>/dev/null || true
          git remote add peer "$PEER_URL"

          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"

          git fetch peer "$PEER_BRANCH"

          TARGET_SHA=$(git rev-parse "origin/$TARGET_BRANCH")
          PEER_SHA=$(git rev-parse "peer/$PEER_BRANCH")

          echo "Target ($TARGET_BRANCH): $TARGET_SHA"
          echo "Peer   ($PEER_BRANCH): $PEER_SHA"

          if [ "$TARGET_SHA" = "$PEER_SHA" ]; then
            echo "Already in sync."
            exit 0
          fi

          if git merge-base --is-ancestor "peer/$PEER_BRANCH" "origin/$TARGET_BRANCH"; then
            echo "This repo already contains peer commits."
            exit 0
          fi

          git merge --no-edit "peer/$PEER_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "Sync applied."
