<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gazzetta di Kyiv — Narrative Command</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body class="news-body live-light">
  <header class="topbar">
    <div class="brand">Gathering Economic Claims</div>
    <div class="top-tools">
      <input id="searchBox" placeholder="Search industries..."/>
      <button id="collapseAll" title="Collapse all">–</button>
      <button id="expandAll" title="Expand all">☰</button>
    </div>
  </header>

  <main class="tri-grid">
    <section class="frames-col">
      <div class="col-title">Narrative Frames</div>
      <div id="frameList"></div>
    </section>

    <section class="claims-col">
      <div class="claims-head">
        <span class="col-title">Active Economic Claims</span>
        <span class="muted">Sorted by potential</span>
      </div>
      <div id="claimsList"></div>
    </section>

    <aside class="focus-col" id="detailsPanel">
      <div class="col-title">Economic Regime Overlap</div>
      <div id="selectedNarrative"></div>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
