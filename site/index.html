<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>La Gazzetta di Kyiv</title>
  <meta name="description" content="Contradiction-first narrative intelligence. The stories that move markets."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=16"/>
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <span class="masthead-bulava" title="Hetman Bohdan Khmelnytsky — The Bulava" aria-hidden="true">
      <svg width="20" height="24" viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="16" x2="10" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="10" cy="12" r="2.5" fill="currentColor" opacity="0.3"/>
        <line x1="7" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="10" y1="3" x2="10" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="10" cy="2" r="1.5" fill="currentColor"/>
        <rect x="5" y="16" width="10" height="2" rx="1" fill="currentColor" opacity="0.4"/>
        <rect x="6" y="19" width="8" height="1.5" rx="0.75" fill="currentColor" opacity="0.3"/>
      </svg>
    </span>
    <span class="masthead-name">La Gazzetta di Kyiv</span>
  </div>
  <div class="masthead-right">
    <span class="masthead-tagline">The stories that move markets</span>
    <button class="bb-toggle" id="bbToggle" title="THE ANCHOR" aria-label="Toggle anchor panel">⚓</button>
    <span class="masthead-meta" id="mastheadMeta">—</span>
  </div>
</header>

<!-- Thesis/Pillar Filter Bar — hidden: internal editorial lens, not public-facing UI -->
<!-- The lens still functions: stories are tagged and filterable via JS, just not exposed as buttons -->

<div class="layout">
  <!-- LEFT: Vertical news list -->
  <section class="news-col" id="newsCol">
    <!-- THE PLAY OF THE DAY -->
    <div class="play-of-day" id="playOfDay" style="display:none">
      <div class="pod-header">🔥 THE PLAY OF THE DAY</div>
      <div class="pod-body"></div>
    </div>
    <!-- JS-populated story cards -->
  </section>

  <!-- RIGHT: THE ANCHOR (desktop) -->
  <aside class="asset-panel" id="assetPanel">
    <h3>⚔ THE ANCHOR</h3>
    <div class="pdr-gauge" id="pdrGauge">
      <span class="pdr-label">PDR</span>
      <span class="pdr-value">—</span>
      <span class="pdr-regime">—</span>
      <span class="pdr-trend">▁▁▁▁▁</span>
    </div>
    <div class="asset-list" id="assetList">
      <!-- JS-populated -->
    </div>
    <div class="asset-note">Key levels · Weekly anchor · Updated Tue 10:00 EET</div>
  </aside>
</div>

<!-- Mobile Bet&Benefit bottom sheet -->
<div class="bb-overlay" id="bbOverlay">
  <div class="bb-sheet" id="bbSheet">
    <div class="bb-sheet-header">
      <h3>⚔ THE ANCHOR</h3>
      <button class="bb-close" id="bbClose" aria-label="Close">✕</button>
    </div>
    <div class="pdr-gauge" id="pdrGaugeMobile">
      <span class="pdr-label">PDR</span>
      <span class="pdr-value">—</span>
      <span class="pdr-regime">—</span>
      <span class="pdr-trend">▁▁▁▁▁</span>
    </div>
    <div class="bb-sheet-body" id="bbSheetBody">
      <!-- JS-populated -->
    </div>
    <div class="asset-note">Key levels · Weekly anchor · Updated Tue 10:00 EET</div>
  </div>
</div>

<footer class="footer">
  <a href="https://t.me/GazzettaDiKyiv">Telegram</a>
  <span>·</span>
  <a href="https://www.reddit.com/r/LaGazzettadiKyiv/">Reddit</a>
  <span>·</span>
  <span>Kyiv · Since 2025</span>
</footer>

<script src="./app.js?v=16"></script>
</body>
</html>
