// v22.18: Product page — render only this page's content after boot()
window.addEventListener('load', function() {
  // Wait for app.js boot() to finish (it runs on DOMContentLoaded)
  setTimeout(function() {
    // Expand the visible container
    var container = document.querySelector('.product-page .container');
    if (container) container.classList.add('expanded');
    // v22.34: Product page — explicitly render triangulation (doesn't fire via click on pre-expanded container)
    if (window.renderTriangulation && document.getElementById('signalGrid')) {
      window.renderTriangulation();
    }
    // Apply i18n to any dynamically rendered content
    if (window.i18n && window.i18n.applyTranslations) {
      setTimeout(function() { window.i18n.applyTranslations(); }, 1000);
    }
  }, 2500);  // v22.34: increased from 2000ms to give boot() time to populate STORIES_DATA
});
