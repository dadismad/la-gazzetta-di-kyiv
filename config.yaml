# Gazzetta di Kyiv — Central Configuration
# All static paths and metadata live here.
# Scripts import dynamically via PyYAML.

site:
  name: "Gazzetta di Kyiv"
  url: "https://www.lagazzettadikyiv.com"
  description: "Institutional-quality market intelligence — capital flows, stories, signals."

paths:
  # Relative to project root (where this config.yaml lives)
  data: "data"
  site: "site"
  scripts: "scripts"

# Data pipeline input/output files
data_files:
  intel_latest: "telegram_intel/latest.json"
  stories: "stories.json"
  flows: "flows.json"
  flow_nodes: "flow_nodes.json"
  stories_archive: "stories_archive.json"
  living_stories: "living_stories.json"
  story_registry: "story_registry.json"
  narratives: "narratives.json"
  stories_in_play: "stories_in_play.json"
  intelligence_objects: "intelligence_objects.json"
  asset_claims: "asset_claims_latest.json"
  representation_techniques: "representation_techniques.json"
  source_registry: "source_registry_ranked.json"
  ops_status: "ops_status.json"
  publish_manifest: "publish_manifest.json"
  website_stories: "website_stories_latest.json"

# API endpoints generated by build_site.py
api_endpoints:
  home: "api/v1/home"
  files:
    - "regime.json"
    - "setups.json"
    - "contradictions.json"
    - "divergences.json"
    - "aftershocks.json"

# Content-hashed assets
assets:
  - "styles.css"
  - "styles-modern.css"
  - "app.js"
  - "i18n.js"
  - "sector.js"
  - "story-app.js"

# HTML pages (copied from root → site/)
pages:
  - "index.html"
  - "about.html"
  - "capital.html"
  - "contacts.html"
  - "cooperation.html"
  - "data.html"
  - "event_horizon.html"
  - "flows.html"
  - "flow-nodes.html"
  - "geopolitics.html"
  - "markets.html"
  - "ops.html"
  - "pleasure.html"
  - "privacy.html"
  - "research.html"
  - "signal.html"
  - "stories.html"
  - "story.html"
  - "track.html"
  - "trades.html"
  - "variant-modern.html"
  - "wealth.html"

# Static site files
static_files:
  - "robots.txt"
  - "sitemap.xml"

# GCS deployment
gcs:
  bucket: "gs://www.lagazzettadikyiv.com"
  gcloud_dir: "/Users/alexstocchi/lagazzettadikyiv/google-cloud-sdk"
  cloudsdk_config: "/Users/alexstocchi/.config/gcloud"

# Cache policy
cache:
  hashed_assets: "public, max-age=31536000, immutable"
  html: "public, max-age=0, must-revalidate"
  json_data: "private, no-store"

# Feature flags
features:
  translate_russian: true
  generate_sitemap: true
  run_validation: true
  decay_stories: false  # disabled until scoring logic is reviewed

# Entity scales for capital flow estimation (fallback when no explicit $ found)
entity_scales:
  central_banks:
    min: 10.0
    max: 150.0
    unit: "B"
    keywords: ["fed", "federal reserve", "ecb", "european central bank", "imf", "pboc",
               "boj", "bank of japan", "boe", "bank of england", "bis", "central bank",
               "powell", "lagarde", "monetary policy", "rate decision"]
  megacorps:
    min: 1.0
    max: 15.0
    unit: "B"
    keywords: ["nvidia", "nvda", "oracle", "jpmorgan", "goldman", "microsoft", "apple",
               "google", "alphabet", "amazon", "meta", "tesla", "microstrategy", "strategy",
               "spacex", "openai", "anthropic", "blackrock", "vanguard", "fidelity"]
  crypto_assets:
    min: 0.1
    max: 8.0
    unit: "B"
    keywords: ["bitcoin", "btc", "ethereum", "eth", "solana", "sol", "crypto", "token",
               "defi", "stablecoin", "rwa", "blockchain", "mining", "hashrate"]
  mutual_funds:
    min: 0.01
    max: 0.5
    unit: "B"
    keywords: ["mutual fund", "etf", "small-cap", "retail fund", "pension fund",
               "index fund", "fund manager", "asset manager"]
  sovereign_wealth:
    min: 5.0
    max: 50.0
    unit: "B"
    keywords: ["sovereign wealth", "swf", "norway fund", "adia", "temasek", "gic",
               "saudi aramco", "qatar investment"]
  defense_military:
    min: 1.0
    max: 20.0
    unit: "B"
    keywords: ["defense", "military", "nato", "pentagon", "missile", "weapons",
               "arms deal", "fighter jet", "drone", "artillery"]

# Flow categories for front-page aggregation
flow_categories:
  sovereign:
    label: "Sovereign Flows"
    asset_classes: ["fixed_income", "fx"]
    description: "Central bank reserves, treasury repositioning, sovereign wealth"
    icon: "🏛"
  systemic:
    label: "Systemic Liquidity"
    asset_classes: ["equities", "commodities"]
    description: "Institutional rotation, index rebalancing, macro hedging"
    icon: "⚡"
  speculative:
    label: "Speculative Arbitrage"
    asset_classes: ["crypto", "defense", "tech"]
    description: "High-velocity positioning, divergence bets, narrative-driven"
    icon: "🎯"
