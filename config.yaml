# Gazzetta di Kyiv — Central Configuration
# All paths relative to this file's directory (project root).
# Scripts load this via PyYAML and resolve paths with Path(__file__).parent.parent.
# Shell scripts source this file or resolve paths via SCRIPT_DIR.

site:
  name: "La Gazzetta di Kyiv"
  url: "https://www.lagazzettadikyiv.com"
  tagline: "Six domains of geopolitical power. Tracked, analyzed, contradicted."

paths:
  db: "gazzetta.db"
  data: "data"
  public: "public"          # frontend source + deploy target
  scripts: "scripts"
  templates: "templates"
  logs: "logs"

# Core data files (relative to paths.data/)
data_files:
  stories: "stories.json"
  flows: "flows.json"
  market_prices: "market_prices.json"
  narratives: "narratives.json"
  track_record: "track_record.json"

# Pipeline chain (scripts run in this order)
pipeline:
  - fetch_intel.py
  - intel_to_stories.py
  - decay_stories.py
  - validate_stories.py
  - generate_flows.py
  - db_to_json.py
  - test_platform.py

# Deploy target
gcs:
  bucket: "gs://www.lagazzettadikyiv.com"
  cache_html: "public, max-age=0, must-revalidate"
  cache_json: "private, no-store"

# Feature flags
features:
  run_validation: true
  decay_stories: false

# Narrative definitions (editorial config)
narratives:
  dollar_decline:
    label: "Dollar Decline"
    description: "USD reserve status erosion, BRICS payment rails, gold repatriation"
    keywords: ["dedollarization", "BRICS", "yuan", "gold reserves", "SWIFT alternative", "CBDC"]
  deglobalization:
    label: "Deglobalization"
    description: "Supply chain fragmentation, trade bloc realignment, sanctions rewiring"
    keywords: ["supply chain", "reshoring", "trade war", "sanctions", "bloc"]
  china_ascent:
    label: "China's Ascent"
    description: "Parallel tech stack, yuan internationalization, BRI, semiconductor independence"
    keywords: ["China", "BRI", "semiconductor", "Huawei", "SMIC", "yuan trade"]
  space_economy:
    label: "Space Economy"
    description: "Orbital infrastructure, space mining, satellite internet, GPS alternatives"
    keywords: ["SpaceX", "satellite", "orbit", "NASA", "CNSA", "asteroid mining"]
  gene_editing:
    label: "Gene Editing & Longevity"
    description: "CRISPR therapies, biotech industrialization, healthspan extension"
    keywords: ["CRISPR", "gene therapy", "longevity", "biotech", "FDA approval"]
  tech_convergence:
    label: "Emerging Tech Convergence"
    description: "AI + quantum + biotech + materials intersections"
    keywords: ["AI", "quantum", "fusion", "materials", "convergence"]
  energy_sovereignty:
    label: "Energy Sovereignty"
    description: "Fusion, renewables, rare earths, critical minerals, grid independence"
    keywords: ["fusion", "renewable", "rare earth", "grid", "critical minerals"]
  wealthy_sports:
    label: "Wealthy Sports"
    description: "Sovereign wealth in teams, sports as soft power, capital concentration"
    keywords: ["sovereign fund", "sports team", "ownership", "soft power"]
